name: Node CI

on:
    push:
        branches:
            - main


jobs:

    build:
        runs-on: ubuntu-latest

        steps:
           - name: check out code
             uses: actions/checkout@v4


           - name: setup node
             uses: actions/setup-node@v4
             with:
                node-version: 20

           - name: install dependencies
             run : npm install
             
           - name: display message
             run: echo "Build success"

           
